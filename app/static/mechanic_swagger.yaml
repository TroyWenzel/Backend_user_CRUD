swagger: '2.0'
info:
  title: 'Mechanics Management API'
  description: 'API for managing mechanic accounts, profiles, and assigned service tickets'
  version: '1.0.0'

host: 'https://api-application-factory-pattern.onrender.com'
schemes:
  - "https"
consumes:
  - "application/json"
produces:
  - "application/json"

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Mechanic token authentication. Format: Bearer <token>"

paths:
  /mechanics/login:
    post:
      tags:
        - Mechanics
      summary: "Mechanic login endpoint"
      description: "Validates mechanic credentials (email and password) and generates a mechanic-specific token"
      parameters:
        - in: "body"
          name: "body"
          description: "Mechanic login credentials"
          required: true
          schema:
            $ref: "#/definitions/MechanicLoginCredentials"
      responses:
        200:
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
          examples:
            application/json:
              message: "Welcome back, Mike!"
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        401:
          description: "Invalid credentials"
          schema:
            $ref: "#/definitions/ErrorResponse"

  /mechanics:
    post:
      tags:
        - Mechanics
      summary: "Create new mechanic"
      description: "Register a new mechanic account in the system"
      parameters:
        - in: "body"
          name: "body"
          description: "New mechanic information"
          required: true
          schema:
            $ref: "#/definitions/MechanicInput"
      responses:
        201:
          description: "Mechanic created successfully"
          schema:
            $ref: "#/definitions/MechanicResponse"
          examples:
            application/json:
              id: 1
              first_name: "Mike"
              last_name: "Johnson"
              email: "mike@shop.com"
              specialization: "Engine Repair"
        400:
          description: "Validation error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    get:
      tags:
        - Mechanics
      summary: "Get all mechanics"
      description: "Retrieve a list of all mechanics in the system"
      responses:
        200:
          description: "Successfully retrieved mechanics"
          schema:
            $ref: "#/definitions/MechanicsResponse"

    put:
      tags:
        - Mechanics
      summary: "Update mechanic profile"
      description: "Update the authenticated mechanic's own profile (rate limited to 5 per day)"
      security:
        - bearerAuth: []
      parameters:
        - in: "body"
          name: "body"
          description: "Updated mechanic information"
          required: true
          schema:
            $ref: "#/definitions/MechanicInput"
      responses:
        200:
          description: "Mechanic updated successfully"
          schema:
            $ref: "#/definitions/MechanicResponse"
        404:
          description: "Mechanic not found"
          schema:
            $ref: "#/definitions/ErrorResponse"

    delete:
      tags:
        - Mechanics
      summary: "Delete mechanic account"
      description: "Delete the authenticated mechanic's own account"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Mechanic deleted successfully"
          schema:
            type: object
            properties:
              message:
                type: string
        404:
          description: "Mechanic not found"
          schema:
            $ref: "#/definitions/ErrorResponse"

  /mechanics/profile:
    get:
      tags:
        - Mechanics
      summary: "Get my profile"
      description: "Retrieve the authenticated mechanic's profile information"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Profile retrieved successfully"
          schema:
            $ref: "#/definitions/MechanicResponse"
        404:
          description: "Mechanic not found"
          schema:
            $ref: "#/definitions/ErrorResponse"

  /mechanics/my-tickets:
    get:
      tags:
        - Mechanics
      summary: "Get my assigned tickets"
      description: "Retrieve all service tickets assigned to the authenticated mechanic"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Service tickets retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/ServiceTicketResponse"
        404:
          description: "Mechanic not found"
          schema:
            $ref: "#/definitions/ErrorResponse"

  /mechanics/top-mechanics:
    get:
      tags:
        - Mechanics
      summary: "Get top mechanics by ticket count"
      description: "Retrieve the top 5 mechanics with the most assigned service tickets"
      responses:
        200:
          description: "Top mechanics retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/TopMechanicResponse"
          examples:
            application/json:
              - id: 1
                first_name: "Mike"
                last_name: "Johnson"
                email: "mike@shop.com"
                ticket_count: 47
              - id: 2
                first_name: "Sarah"
                last_name: "Williams"
                email: "sarah@shop.com"
                ticket_count: 42
        404:
          description: "No mechanics found with tickets"
          schema:
            $ref: "#/definitions/ErrorResponse"

definitions:
  MechanicLoginCredentials:
    type: object
    properties:
      email:
        type: string
        example: "mike@shop.com"
      password:
        type: string
        example: "password123"
    required:
      - email
      - password

  LoginResponse:
    type: object
    properties:
      message:
        type: string
      token:
        type: string

  MechanicInput:
    type: object
    properties:
      first_name:
        type: string
        example: "Mike"
      last_name:
        type: string
        example: "Johnson"
      email:
        type: string
        example: "mike@shop.com"
      password:
        type: string
        example: "password123"
      specialization:
        type: string
        example: "Engine Repair"
      certification:
        type: string
        example: "ASE Certified"

  MechanicResponse:
    type: object
    properties:
      id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      password:
        type: string
        description: "Hashed password"
      specialization:
        type: string
      certification:
        type: string

  MechanicsResponse:
    type: array
    items:
      $ref: "#/definitions/MechanicResponse"

  TopMechanicResponse:
    type: object
    properties:
      id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      ticket_count:
        type: integer
        description: "Number of tickets assigned to this mechanic"

  ServiceTicketResponse:
    type: object
    properties:
      id:
        type: integer
      customer_id:
        type: integer
      description:
        type: string
      status:
        type: string
      created_at:
        type: string
        format: date-time

  ErrorResponse:
    type: object
    properties:
      error:
        type: string
      message:
        type: string